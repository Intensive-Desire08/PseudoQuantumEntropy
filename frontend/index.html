<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PseudoQuantum Entropy Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="#home">PseudoQuantum Entropy</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#encryption">Encryption</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#keygen">Key Generation</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#settings">Settings</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#test">Entropy Test</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section id="home" class="page-section active">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1>System Status</h1>
          <button id="refresh-status" class="btn btn-primary btn-sm" type="button">Refresh</button>
        </div>

        <div id="status-output" class="row g-3">
          <div class="col-12">
            <div class="alert alert-light border">Loading status...</div>
          </div>
        </div>
      </section>

      <section id="encryption" class="page-section d-none">
        <h1>Encryption &amp; Decryption</h1>
        <form id="encryption-form" class="row g-3">
          <div class="col-md-5">
            <label for="encryption-file" class="form-label">Select file</label>
            <input id="encryption-file" class="form-control" type="file" required />
          </div>
          <div class="col-md-5">
            <label for="encryption-password" class="form-label">Password</label>
            <input id="encryption-password" class="form-control" type="password" placeholder="Enter password" required />
          </div>
          <div class="col-md-2">
            <label for="encryption-mode" class="form-label">Mode</label>
            <select id="encryption-mode" class="form-select">
              <option value="encrypt">Encrypt</option>
              <option value="decrypt">Decrypt</option>
            </select>
          </div>
          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary w-100">Run</button>
          </div>
        </form>

        <div id="encryption-status" class="alert alert-secondary mt-3">Ready.</div>
        
        <div class="mt-4" id="encryption-transparency" style="display: none;">
          <h5>Cryptographic Details (Read-only)</h5>
          <div class="row g-2">
            <div class="col-md-12">
              <label class="form-label">Derived Key (Hex)</label>
              <input id="encryption-out-key" class="form-control form-control-sm" type="text" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Initialization Vector - IV (Hex)</label>
              <input id="encryption-out-iv" class="form-control form-control-sm" type="text" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label">Authentication Tag (Hex)</label>
              <input id="encryption-out-tag" class="form-control form-control-sm" type="text" readonly />
            </div>
          </div>
        </div>

        <div class="mt-3">
          <a id="encryption-download" class="btn btn-success d-none" href="#" download>Download result</a>
        </div>
      </section>

      <section id="keygen" class="page-section d-none">
        <h1>Key Generation</h1>
        <form id="keygen-form" class="row g-3">
          <div class="col-md-6">
            <label for="keygen-password" class="form-label">Password</label>
            <input id="keygen-password" class="form-control" type="text" placeholder="Enter password" />
          </div>
          <div class="col-md-6">
            <label for="keygen-salt" class="form-label">Salt</label>
            <input id="keygen-salt" class="form-control" type="text" placeholder="Enter salt" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Generate key</button>
            <button type="button" id="copy-key-btn" class="btn btn-outline-secondary">Copy key</button>
          </div>
        </form>

        <div id="keygen-status" class="alert alert-secondary mt-3">Ready.</div>
        <div class="mt-3">
          <label for="keygen-output" class="form-label">Generated key</label>
          <textarea id="keygen-output" class="form-control" rows="6" readonly placeholder="Generated key will appear here..."></textarea>
        </div>
      </section>

      <section id="settings" class="page-section d-none">
        <h1>Settings</h1>
        <form id="settings-form" class="row g-3">
          <div class="col-md-4">
            <label for="settings-port" class="form-label">COM Port</label>
            <input id="settings-port" class="form-control" type="text" />
          </div>
          <div class="col-md-4">
            <label for="settings-baud" class="form-label">Baud Rate</label>
            <input id="settings-baud" class="form-control" type="number" min="1" step="1" />
          </div>
          <div class="col-md-4">
            <label for="settings-source" class="form-label">Entropy Source</label>
            <input id="settings-source" class="form-control" type="text" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Save settings</button>
          </div>
        </form>

        <div id="settings-status" class="alert alert-secondary mt-3">Loading settings...</div>
      </section>

      <section id="test" class="page-section d-none">
        <h1>Entropy Test</h1>
        <form id="entropy-test-form" class="row g-3">
          <div class="col-md-4">
            <label for="entropy-bytes" class="form-label">Byte count</label>
            <input id="entropy-bytes" class="form-control" type="number" min="64" step="64" value="1024" />
          </div>
          <div class="col-md-4">
            <label for="entropy-mode" class="form-label">Mode</label>
            <select id="entropy-mode" class="form-select">
              <option value="quick">Quick</option>
              <option value="full">Full</option>
            </select>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Run test</button>
          </div>
        </form>

        <div id="entropy-status" class="alert alert-secondary mt-3">Ready.</div>
        <div class="mt-3">
          <label for="entropy-output" class="form-label">Result</label>
          <textarea id="entropy-output" class="form-control" rows="16" readonly placeholder="Test output will appear here..."></textarea>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/home.js" defer></script>
    <script src="js/encryption.js" defer></script>
    <script src="js/keygen.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/test.js" defer></script>
  </body>
</html>
